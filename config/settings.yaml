broker:
  name: angel_one
  # Credentials loaded from .env file
  rate_limit_per_sec: 10
  instrument_cache_hours: 24

trading:
  mode: paper  # paper | live
  capital: 100000
  risk_per_trade_pct: 2.0
  max_daily_loss_pct: 5.0
  max_open_positions: 5
  max_positions_per_instrument: 2
  trading_start: "09:20"
  trading_end: "15:00"
  hard_cutoff: "15:00"
  no_new_trades_after: "14:30"

signals:
  min_score: 75
  cooldown_minutes: 15
  primary_timeframe: "5min"
  confirmation_timeframe: "15min"
  weights:
    technical: 0.40
    oi_analysis: 0.30
    iv_analysis: 0.15
    price_action: 0.15
  min_categories_agree: 3  # At least 3 out of 4 must agree on direction

options:
  preferred_strikes_otm: 2
  min_expiry_days_index: 2
  min_expiry_days_stock: 5
  max_bid_ask_spread_pct: 2.0
  min_oi: 5000
  min_volume: 1000
  min_premium: 5.0
  max_premium: 500.0

stop_loss:
  initial_pct: 30
  trailing_activation_pct: 20
  trailing_lock_pct: 50
  time_based_exit_minutes: 60
  hard_cutoff_time: "15:00"
  underlying_sl_pct: 1.0

scanner:
  enabled: true
  scan_times: ["09:16", "10:00", "12:00"]
  max_stocks_to_monitor: 15
  min_option_oi: 5000
  min_volume_ratio: 1.5
  min_adx: 20

strategies:
  momentum_buy:
    enabled: true
    target_pct: 40
    min_score: 75
  breakout_buy:
    enabled: true
    target_pct: 50
    volume_surge_ratio: 2.0
    min_score: 78
  oi_reversal:
    enabled: true
    target_pct: 35
    min_oi_change_pct: 10
    min_score: 80
  expiry_day:
    enabled: true
    target_pct: 75
    opening_range_minutes: 15
    min_score: 72
  vwap_pullback:
    enabled: true
    target_pct: 35
    stop_loss_pct: 25
    min_score: 72
    entry_start: "09:45"
    entry_end: "14:00"
  gap_and_go:
    enabled: true
    target_pct: 45
    stop_loss_pct: 30
    min_score: 70
    entry_start: "09:35"
    entry_end: "11:30"
  rsi_divergence:
    enabled: true
    target_pct: 40
    stop_loss_pct: 25
    min_score: 68
    rsi_period: 14
    lookback: 20
  scalping:
    enabled: true
    target_pct: 20
    stop_loss_pct: 15
    min_score: 80
    max_hold_minutes: 20
    entry_start: "09:20"
    entry_end: "14:30"
  straddle_breakout:
    enabled: true
    target_pct: 50
    stop_loss_pct: 35
    min_score: 70
    entry_start: "09:45"
    entry_end: "13:30"
  multi_timeframe:
    enabled: true
    target_pct: 50
    stop_loss_pct: 30
    min_score: 70
    time_exit_minutes: 120
  # --- NIFTY-specific strategies ---
  nifty_orb:
    enabled: true
    target_pct: 40
    stop_loss_pct: 30
    min_score: 72
    min_vix: 13.0
    entry_start: "09:31"
    entry_end: "12:00"
  nifty_gamma_blast:
    enabled: true
    target_pct: 100
    stop_loss_pct: 40
    min_score: 65
    max_consolidation_range: 50
    min_premium: 2.0
    max_premium: 60.0
    entry_start: "13:45"
    entry_end: "15:00"
  nifty_vix_regime:
    enabled: true
    min_score: 72
    entry_start: "09:30"
    entry_end: "14:00"
  nifty_pcr_reversal:
    enabled: true
    target_pct: 40
    stop_loss_pct: 25
    min_score: 68
    bullish_pcr_threshold: 1.3
    bearish_pcr_threshold: 0.7
  nifty_gift_gap:
    enabled: true
    min_gap_pct: 0.5
    target_pct: 45
    stop_loss_pct: 30
    min_score: 70
    entry_start: "09:35"
    entry_end: "11:30"
  nifty_event_day:
    enabled: true
    min_score: 65
    pre_event_target_pct: 30
    post_event_target_pct: 60
    post_event_sl_pct: 40
  nifty_oi_wall:
    enabled: true
    bounce_target_pct: 35
    break_target_pct: 50
    bounce_sl_pct: 25
    break_sl_pct: 30
    min_score: 68
    proximity_points: 50

alerts:
  telegram_enabled: true
  # Credentials loaded from .env file
  alert_on_signal: true
  alert_on_order: true
  alert_on_sl_hit: true
  alert_on_target_hit: true
  alert_on_daily_summary: true

logging:
  level: INFO
  file: data/logs/trading.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

database:
  path: data/trading.db
